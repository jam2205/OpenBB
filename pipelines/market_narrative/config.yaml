# Market Narrative Pipeline config. Edit freely; nothing here is hard-coded in code.
models:
  sentiment: yiyanghkust/finbert-tone                    # pre-trained financial tone (pos/neg/neutral)
  zero_shot: MoritzLaurer/ModernBERT-large-zeroshot-v2.0 # pre-trained label-anything classifier -> drivers
  embedder: nomic-ai/modernbert-embed-base               # pre-trained 8k-context embeddings (similarity / search)
  embed_prefix: "classification: "                       # nomic task prefix; use "search_query: "/"search_document: " for retrieval
  base: answerdotai/ModernBERT-large                     # only used by mnp.finetune (optional upgrade)
  tone_head: heads/tone        # optional: fine-tuned ModernBERT tone head; used if the folder exists
  driver_head: heads/driver    # optional: fine-tuned driver head; used if the folder exists
  max_length: 8192
  predictive: AcyLa/multi-asset-predictive-model
  device: auto                                 # auto | cpu | cuda

lookback_days: 180
corr_window: 20            # rolling correlation window (trading days)

# Focus assets get a full section. Peers feed the cross-asset / correlation block.
universe:
  equities: [SPY, QQQ, AAPL, NVDA]
  metals:   {GC=F: Gold, SI=F: Silver, HG=F: Copper}
  bonds:    {^TNX: US10Y yield, ^FVX: US5Y yield, TLT: 20Y+ Treasury ETF}
  fx_openbb: [EURUSD, USDJPY]        # pulled via obb.currency.price.historical
  fx_minio:  []                      # pairs OpenBB doesn't cover -> loaded from MinIO, e.g. [USDNGN, USDKES]

openbb:
  price_provider: yfinance
  news_provider: yfinance            # swap to benzinga/fmp/tiingo if you have keys
  documents_provider: fmp            # transcripts + MD&A (FMP key)
  earnings_provider: fmp             # needs FMP key; pipeline degrades gracefully without it
  econ_calendar_provider: fmp

minio:
  endpoint_env: MINIO_ENDPOINT       # values read from env / Colab secrets, never stored here
  access_key_env: MINIO_ACCESS_KEY
  secret_key_env: MINIO_SECRET_KEY
  secure: true
  bucket: fx-data
  # object path per pair; {pair} is substituted. Expect columns: date, close (open/high/low optional)
  object_pattern: "daily/{pair}.parquet"

# Regime = which "cookie cutter" template is used this week. First match wins (priority order).
regimes:
  - name: central_bank
    template: macro.md.j2
    econ_keywords: [FOMC, Fed Interest Rate Decision, ECB, BoJ, BoE]
  - name: bond_week
    template: macro.md.j2
    econ_keywords: [CPI, PCE, Nonfarm Payrolls, Treasury, Auction, GDP]
  - name: earnings_week
    template: earnings.md.j2
    min_focus_reporters: 1           # >=1 focus equity reports in the window
  - name: default
    template: default.md.j2

# Drivers: name -> short label the zero-shot model scores ("This news is about {label}.").
drivers:
  rates:       "interest rates and bond yields"
  inflation:   "inflation and consumer prices"
  earnings:    "company earnings and guidance"
  geopolitics: "geopolitics, war, sanctions or tariffs"
  metals:      "gold, silver or copper prices"
  fx:          "currencies and the US dollar"
zero_shot_threshold: 0.35    # below this top score a headline is tagged "other"

# Only used to weak-label data for the optional fine-tune (mnp.finetune driver).
driver_keywords:
  rates:       [Fed, FOMC, Treasury, yield, rate hike, rate cut, Powell, bond]
  inflation:   [CPI, PCE, inflation, consumer prices, PPI]
  earnings:    [earnings, EPS, revenue, guidance, quarterly results]
  geopolitics: [war, sanction, tariff, missile, election, trade war]
  metals:      [gold, silver, copper, bullion, precious metal]
  fx:          [dollar, yen, euro, currency, forex, intervention]
