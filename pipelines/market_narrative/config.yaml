# Market Narrative Pipeline config. Edit freely; nothing here is hard-coded in code.
models:
  sentiment: beethogedeon/Modern-FinBERT-large           # ModernBERT-large fine-tuned on Financial PhraseBank (pos/neg/neutral, 8k ctx)
  sentiment_check: yiyanghkust/finbert-tone              # second opinion on headlines; set null to skip (saves ~0.4GB)
  doc_chunk_tokens: 1024     # long docs are chunked; the tone model was trained on sentences, so keep chunks modest
  zero_shot: MoritzLaurer/ModernBERT-large-zeroshot-v2.0 # pre-trained label-anything classifier -> drivers
  embedder: nomic-ai/modernbert-embed-base               # pre-trained 8k-context embeddings (similarity / search)
  embed_prefix: "classification: "                       # nomic task prefix; use "search_query: "/"search_document: " for retrieval
  base: answerdotai/ModernBERT-large                     # only used by mnp.finetune (optional upgrade)
  tone_head: heads/tone        # optional: your own fine-tuned tone head; overrides `sentiment` if the folder exists
  driver_head: heads/driver    # optional: fine-tuned driver head; used if the folder exists
  max_length: 8192
  predictive: AcyLa/multi-asset-predictive-model
  device: auto                                 # auto | cpu | cuda

lookback_days: 180

# AcyLa/multi-asset-predictive-model: per-ETF LightGBM(+LSTM), horizons 1/5/21d.
predictive:
  tickers: [SPY, QQQ, GLD, SLV, USO, EEM, EFA, EWJ]   # only these 14 are covered: + EWG EWU FXI INDA EWZ KWEB
  history_days: 900        # its features need ~200+ bars of warm-up
  use_lstm: false          # LightGBM-only is the repo's own "fast mode"; true also loads the LSTMs
  revision: null           # pin a commit hash once reviewed (model files are pickles)
corr_window: 20            # rolling correlation window (trading days)

# Focus assets get a full section. Peers feed the cross-asset / correlation block.
universe:
  equities: [SPY, QQQ, AAPL, NVDA]
  metals:   {GC=F: Gold, SI=F: Silver, HG=F: Copper}
  bonds:    {^TNX: US10Y yield, ^FVX: US5Y yield, TLT: 20Y+ Treasury ETF}
  fx_openbb: [EURUSD, USDJPY]        # pulled via obb.currency.price.historical
  fx_ecb:    []                     # ECB daily reference rates (no key), e.g. [EURPLN, EURHUF, EURTRY, EURZAR]
  fx_minio:  []                      # pairs read from your private hourly candles (can be a large download), e.g. [EURCHF, NZDJPY]

openbb:
  price_provider: yfinance
  news_provider: yfinance            # swap to benzinga/fmp/tiingo if you have keys
  transcript_provider: fmp           # earnings-call transcripts: FMP paid plans only (402 on free/starter)
  mdna_provider: sec                 # MD&A from SEC filings, free, no key
  earnings_provider: fmp             # needs FMP key; pipeline degrades gracefully without it
  # Tried in order; the FIRST that returns rows is used (two calendars would list each release twice).
  #   medallion = your own calendar dataset (needs your connector cell + medallion.register)
  #   benzinga  = Benzinga economic calendar (BENZINGA_API_KEY): times, consensus, prior, actual
  #   fred_rest = FRED release dates (FRED_API_KEY): dates only, US only; last resort
  #   fmp / tradingeconomics = OpenBB providers that need a paid plan; add them here if you upgrade
  econ_calendar_providers: [medallion, benzinga, fred_rest]
  # Always added on top. treasury_auctions = FiscalData, then TreasuryDirect (no key).
  econ_calendar_extra: [treasury_auctions]
  auction_terms: [10-Year, 20-Year, 30-Year]   # which coupon auctions make it a "bond week"

# Your own economic calendar (the dataset registered under the `calendar` role).
calendar:
  currencies: [USD, EUR, JPY, GBP, CHF, NZD, AUD, CAD]   # whose events count
  impacts: [high]                                        # add "medium" for a busier table
  max_rows: 40
  # FRED calls every dataset it hosts a "release" (research papers, six CPI variants), so only
  # these exact release names count when the FRED calendar is used.
  fred_releases:
    - Consumer Price Index
    - Producer Price Index
    - Employment Situation
    - Gross Domestic Product
    - Personal Income and Outlays
    - Advance Monthly Sales for Retail and Food Services
    - Unemployment Insurance Weekly Claims Report
    - Job Openings and Labor Turnover Survey
    - G.17 Industrial Production and Capacity Utilization
    - New Residential Construction
    - New Residential Sales
    - Existing Home Sales
    - Surveys of Consumers
    - U.S. Import and Export Price Indexes
    - Employment Cost Index
    - Monthly Treasury Statement

# FRED (key): daily/weekly US macro that drives cross-asset moves. Shown with 1w / 1m changes.
fred:
  series:
    DFII10: 10Y real yield (TIPS)          # main driver of gold
    T10YIE: 10Y breakeven inflation
    DFF: Fed funds effective
    BAMLH0A0HYM2: HY credit spread
    DTWEXBGS: Broad trade-weighted USD
    ICSA: Initial jobless claims
  gold_driver: DFII10

# FMP direct (key). Company cards for names reporting this week, a US data scorecard, sector and
# industry moves. Built on endpoints verified on a Starter-level plan; see mnp/fmp.py.
fmp:
  enabled: true
  max_cards: 3
  always_cards: []            # tickers to card every week even when they are not reporting
  # federalFunds is left out on purpose: FMP's monthly figure moved 3.75 -> 3.88 in a month when
  # the daily rate (DFF, in the FRED table) did not move. Use the FRED table for the policy rate.
  us_indicators: [CPI, unemploymentRate, totalNonfarmPayroll, initialClaims,
                  retailSales, consumerSentiment]

# Swiss National Bank data portal (data.snb.ch): no key. Adds the Switzerland / CHF section.
snb:
  enabled: true

# IMF (no API key). Fill `indicators` with symbols found via the notebook's IMF search cell.
# Format: "DATAFLOW::INDICATOR".
imf:
  countries: [USA, JPN, DEU, GBR, CHN, CHE, NZL]
  indicators: []
  # IMF PortWatch's public server now answers "Token Required" (verified 2026-11-10), so this is off.
  # To retry later: [suez_canal, panama_canal, strait_of_hormuz, bab_el-mandeb_strait, malacca_strait]
  chokepoints: []

# Regime = which "cookie cutter" template is used this week. First match wins (priority order).
regimes:
  - name: central_bank
    template: macro.md.j2
    event_codes: [RATE_DECISION]      # any central bank in calendar.currencies (medallion calendar)
    econ_keywords: [Fed Interest Rate Decision, Monetary policy meeting]   # for paid calendars (FMP etc.)
    # Decision days. FRED's calendar cannot be used for this: it lists "FOMC Press Release" every
    # day. FOMC 2026 from the Fed's published schedule -- verify at federalreserve.gov and add
    # 2027 plus the ECB / BoJ / BoE / SNB / RBNZ dates you trade around.
    dates:
      "2026-01-28": FOMC decision
      "2026-03-18": FOMC decision
      "2026-04-29": FOMC decision
      "2026-06-17": FOMC decision
      "2026-07-29": FOMC decision
      "2026-09-16": FOMC decision
      "2026-10-28": FOMC decision
      "2026-12-09": FOMC decision
  - name: bond_week
    template: macro.md.j2
    families: [inflation, labour, auction]   # medallion calendar labels, high impact only
    # Matched against FRED release names and "Treasury Auction: <term> <type>" events.
    econ_keywords: [Consumer Price Index, Personal Income and Outlays, Employment Situation,
                    Gross Domestic Product, Producer Price Index, "Treasury Auction:", CPI, Nonfarm Payrolls, HICP]
  - name: earnings_week
    template: earnings.md.j2
    min_focus_reporters: 1           # >=1 focus equity reports in the window
  - name: default
    template: default.md.j2

# Drivers: name -> short label the zero-shot model scores ("This news is about {label}.").
drivers:
  rates:       "interest rates and bond yields"
  inflation:   "inflation and consumer prices"
  earnings:    "company earnings and guidance"
  geopolitics: "geopolitics, war, sanctions or tariffs"
  metals:      "gold, silver or copper prices"
  fx:          "currencies and the US dollar"
zero_shot_threshold: 0.35    # below this top score a headline is tagged "other"

# Only used to weak-label data for the optional fine-tune (mnp.finetune driver).
driver_keywords:
  rates:       [Fed, FOMC, Treasury, yield, rate hike, rate cut, Powell, bond]
  inflation:   [CPI, PCE, inflation, consumer prices, PPI]
  earnings:    [earnings, EPS, revenue, guidance, quarterly results]
  geopolitics: [war, sanction, tariff, missile, election, trade war]
  metals:      [gold, silver, copper, bullion, precious metal]
  fx:          [dollar, yen, euro, currency, forex, intervention]
